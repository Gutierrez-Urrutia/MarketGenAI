# Cloud Build: compila el frontend apuntando a la API indicada y sube la imagen.
# Uso (desde frontend/): gcloud builds submit . --config=cloudbuild.yaml --substitutions=_API_URL=https://<api>/api/v1
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=VITE_API_URL=${_API_URL}
      - -t
      - us-central1-docker.pkg.dev/${PROJECT_ID}/marketgen/web:dev
      - .
images:
  - us-central1-docker.pkg.dev/${PROJECT_ID}/marketgen/web:dev
substitutions:
  _API_URL: ""
