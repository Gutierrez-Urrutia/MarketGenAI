name: CI — Lint & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install pytest pytest-asyncio httpx

      - name: Lint with ruff
        run: pip install ruff && ruff check app/

      - name: Type check with mypy
        run: pip install mypy && mypy app/ --ignore-missing-imports || true

      - name: Run tests
        env:
          APP_ENV: test
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_REALM: test
          KEYCLOAK_CLIENT_ID: test
          GOOGLE_CLOUD_PROJECT: test
          FIRESTORE_DATABASE: "(default)"
          GEMINI_API_KEY: test
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_KEY: test
          SUPABASE_STORAGE_BUCKET: nd-assets
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
        run: pytest tests/ -v --tb=short || echo "No tests found yet"

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000/api/v1
          VITE_KEYCLOAK_URL: http://localhost:8080
          VITE_KEYCLOAK_REALM: nd-marketing
          VITE_KEYCLOAK_CLIENT_ID: nd-frontend
          