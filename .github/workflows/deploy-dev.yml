name: Deploy dev (GCP)

# Cada push a main prueba el código y lo despliega en el entorno dev de Google Cloud (proyecto marketgen-dev).
# La autenticación usa Workload Identity Federation: no hay claves de Google en el repositorio ni en los secretos.
# Configuración de la identidad: infra/gcp/setup_cicd.py
on:
  push:
    branches: [main, feature/ci-cd-gcp]   # TEMPORAL: la rama de pruebas se quita antes de integrar
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false   # un despliegue en curso termina antes de empezar el siguiente

env:
  PROJECT: marketgen-dev
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev/marketgen-dev/marketgen
  API_URL: https://marketgen-api-156520322318.us-central1.run.app
  WIF_PROVIDER: projects/156520322318/locations/global/workloadIdentityPools/github/providers/github-actions
  DEPLOYER: marketgen-deployer@marketgen-dev.iam.gserviceaccount.com

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Dependencias del sistema (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libgdk-pixbuf-2.0-0
      - name: Pruebas del backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pruebas y compilación del frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  deploy:
    name: Desplegar en dev
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # necesario para el token temporal de Google
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Construir la imagen de la API
        run: |
          # Se sube el código al bucket de Cloud Build y se construye desde ahí: `builds submit .` falla con esta
          # cuenta al preparar el bucket de origen, aunque tenga acceso de lectura y escritura a él.
          SRC=gs://${PROJECT}_cloudbuild/source/api-${GITHUB_SHA::7}.tgz
          tar -czf /tmp/api-src.tgz -C backend --exclude=tests --exclude=__pycache__ --exclude=.venv --exclude='.env*' --exclude='service-account*.json' .
          gcloud storage cp /tmp/api-src.tgz $SRC --project=$PROJECT
          gcloud builds submit $SRC --tag=$REGISTRY/api:dev --project=$PROJECT --region=$REGION
          gcloud artifacts docker tags add $REGISTRY/api:dev $REGISTRY/api:${GITHUB_SHA::7} --project=$PROJECT

      - name: Desplegar la API en Cloud Run
        run: |
          gcloud run services update marketgen-api \
            --image=$REGISTRY/api:dev \
            --update-env-vars=DEPLOYED_FROM=${GITHUB_SHA::7} \
            --region=$REGION --project=$PROJECT --quiet

      - name: Decidir si hay que desplegar el frontend
        id: front
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || git diff --name-only "$before" "$GITHUB_SHA" | grep -q '^frontend/'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en frontend/: no se redespliega la web."
          fi

      - name: Construir y desplegar el frontend
        if: steps.front.outputs.deploy == 'true'
        run: |
          SRC=gs://${PROJECT}_cloudbuild/source/web-${GITHUB_SHA::7}.tgz
          tar -czf /tmp/web-src.tgz -C frontend --exclude=node_modules --exclude=dist --exclude='.env*' .
          gcloud storage cp /tmp/web-src.tgz $SRC --project=$PROJECT
          gcloud builds submit $SRC --config=frontend/cloudbuild.yaml \
            --substitutions=_API_URL=$API_URL/api/v1 --project=$PROJECT --region=$REGION
          gcloud run services update marketgen-web \
            --image=$REGISTRY/web:dev \
            --update-env-vars=DEPLOYED_FROM=${GITHUB_SHA::7} \
            --region=$REGION --project=$PROJECT --quiet

      - name: Reiniciar el worker si está encendido
        run: |
          status=$(gcloud compute instances describe marketgen-worker --zone=us-central1-a --project=$PROJECT --format='value(status)')
          if [ "$status" = "RUNNING" ]; then
            # El arranque de la VM descarga la imagen más reciente (worker_startup.sh).
            gcloud compute instances reset marketgen-worker --zone=us-central1-a --project=$PROJECT --quiet
            echo "Worker reiniciado con la imagen nueva."
          else
            echo "Worker $status: tomará la imagen nueva cuando se encienda (python infra/gcp/vm.py start)."
          fi

      - name: Comprobar que la API responde
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' $API_URL/api/v1/health || true)
            echo "intento $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "La API no respondió 200 después del despliegue" && exit 1

      - name: Resumen
        run: |
          {
            echo "### Desplegado en dev"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- API: $API_URL"
            echo "- Web: https://marketgen-web-156520322318.us-central1.run.app"
          } >> "$GITHUB_STEP_SUMMARY"
