services:
  - type: keyvalue
    name: marketgen-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: marketgen-ai
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_SECRET_KEY
        sync: false
      - key: BACKEND_CORS_ORIGINS
        value: https://market-gen-ai-indol.vercel.app
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: marketgen-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: marketgen-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: marketgen-redis
          property: connectionString
      - key: GOOGLE_CLOUD_PROJECT
        value: marketgen-ai-497805
      - key: FIRESTORE_DATABASE
        value: "(default)"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

  - type: worker
    name: marketgen-ai-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.workers.celery_app worker --loglevel=info -Q default,llm,exports --concurrency=1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_SECRET_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: marketgen-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: marketgen-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: marketgen-redis
          property: connectionString
      - key: GOOGLE_CLOUD_PROJECT
        value: marketgen-ai-497805
      - key: FIRESTORE_DATABASE
        value: "(default)"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
