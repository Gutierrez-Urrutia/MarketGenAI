services:
  - type: web
    name: marketgen-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # RNF-02: detrás del balanceador de Render, la IP de la conexión es la del balanceador;
      # con esto el registro de auditoría usa el primer valor de X-Forwarded-For (ver DOCUMENTACION/RNF-02).
      - key: TRUST_PROXY_HEADERS
        value: "true"
      # RNF-04: obligatorias en producción; si falta alguna, el arranque se detiene y las lista todas (docs/MANUAL-DESPLIEGUE.md, sección 3).
      - key: APP_SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: STORAGE_BACKEND
        value: gcs
      - key: GCS_BUCKET
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: LOCAL_DEV_AUTH_ENABLED
        value: "false"
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      # Login con Microsoft (opcional; si se pone el ID de cliente, hacen falta los tres).
      - key: MICROSOFT_OAUTH_CLIENT_ID
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT_ID
        sync: false
      - key: MICROSOFT_REDIRECT_URI
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: PIPELINE_ENCRYPTION_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
